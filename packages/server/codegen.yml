overwrite: true

schema:
  - ./src/graphql/base.schema.ts
  - ./src/**/**/schema.ts

documents: null

generates:
  ../types/src/graphql-types.ts:
    plugins:
      - typescript
      - typescript-resolvers


config:
  federation: true
  useTypeImports: true
  enumsAsConst: true
  namingConvention:
    enumValues: keep
